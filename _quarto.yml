project:
  type: book
  output-dir: docs

lang: es
number-depth: 0
callout-appearance: default
callout-icon: true

resource-files:
  - estilos/portadas/portada-teorico-pdf.png
  - estilos/portadas/portada-teorico-web.png

book:
  title: "Fundamentos Matemáticos del Aprendizaje Automático"
  subtitle: "Teoría, demostraciones y formulación rigurosa de los métodos de regresión, clasificación y análisis de datos"
  author: "Jesús Gilberto Rodríguez Escobedo"
  output-file: "fundamentos-matematicos-aprendizaje-automatico"
  date: today
  downloads: [pdf]

  chapters:
    - index.qmd
    - prefacio.qmd
    - presentacion.qmd
    - introduccion.qmd
    - notacion.qmd

    - part: "I. Fundamentos matemáticos"
      chapters:
        - fundamentos/conjuntos-funciones.qmd
        - fundamentos/algebra-lineal.qmd
        - fundamentos/probabilidad-estadistica.qmd
        - fundamentos/calculo-optimizacion.qmd

    - part: "II. Fundamentos del aprendizaje automático"
      chapters:
        - aprendizaje/aprendizaje-supervisado.qmd
        - aprendizaje/teoria-clasificacion.qmd
        - aprendizaje/evaluacion-modelos.qmd
        - aprendizaje/regularizacion.qmd

    - part: "III. Modelos de regresión"
      chapters:
        - regresion/regresion-lineal-simple.qmd
        - regresion/regresion-lineal-multiple.qmd
        - regresion/regresion-logistica.qmd

    - part: "IV. Métodos de clasificación"
      chapters:
        - clasificacion/knn.qmd
        - clasificacion/arboles-decision.qmd
        - clasificacion/random-forest.qmd
        - clasificacion/svm.qmd
        - clasificacion/redes-neuronales.qmd

    - part: "V. Aprendizaje no supervisado"
      chapters:
        - no-supervisado/pca.qmd
        - no-supervisado/kmeans.qmd
        - no-supervisado/agrupamiento-jerarquico.qmd
        - no-supervisado/reglas-asociacion.qmd

    - part: "VI. Temas avanzados"
      chapters:
        - avanzados/teoria-generalizacion.qmd
        - avanzados/series-tiempo.qmd

    - referencias.qmd
    - indice-tematico.qmd

  page-footer:
    left: "Fundamentos Matemáticos del Aprendizaje Automático"
    right: "Jesús Gilberto Rodríguez Escobedo"

bibliography: referencias.bib

crossref:
  chapters: true
  eq-prefix: "Ecuación"
  fig-prefix: "Figura"
  tbl-prefix: "Tabla"
  thm-prefix: "Teorema"
  def-prefix: "Definición"
  exm-prefix: "Ejemplo"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: estilos/styles.css
    toc: true
    toc-depth: 2
    toc-title: "En este capítulo"
    code-overflow: wrap
    code-line-numbers: true
    code-block-bg: "#F4F7FA"
    code-block-border-left: "#1F4E79"
    number-sections: true
    code-fold: true
    code-tools: true

  pdf:
    include-in-header: estilos/callouts-pdf.tex
    documentclass: scrreprt
    classoption:
      - oneside
      - open=any
    toc: true
    toc-depth: 1
    toc-title: "Contenido"
    number-sections: true
    code-line-numbers: true
    code-block-bg: "#F4F7FA"
    code-block-border-left: "#1F4E79"
    keep-tex: true
    geometry:
      - top=2.2cm
      - bottom=2.2cm
      - left=2.6cm
      - right=2.3cm
      - headsep=0.6cm
      - headheight=15pt
    fontsize: 10.5pt
    linestretch: 1.06
